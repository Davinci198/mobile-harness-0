name: dany-debug-apk

on:
  push:
    branches:
      - main
      - 'dany/**'
      - 'fix/**'
      - 'feat/**'
      - 'ci/**'
      - 'refactor/**'
      - 'test/**'
      - 'arena/**'
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes for the in-app update prompt'
        required: false
        default: ''

concurrency:
  group: dany-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      # Release builds are minified; keep R8 off the daemon heap limit so it can
      # finish on the 7 GB runners.
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          # Later steps build APKs and publish them; none of them need the
          # checkout token on disk, so do not persist it into .git/config.
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable debug keystore
        env:
          MH_DEBUG_KEYSTORE_B64: ${{ secrets.MH_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          echo "$MH_DEBUG_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          echo "debug.keystore restored ($(stat -c%s "$HOME/.android/debug.keystore") bytes)"
          sha256sum "$HOME/.android/debug.keystore"
          ls -la "$HOME/.android/"
      - name: Unit tests
        if: github.event_name != 'release'
        run: |
          set -o pipefail
          mkdir -p dist/ci
          ./gradlew :app:testOnlineDebugUnitTest :app:testOfflineDebugUnitTest 2>&1 \
            | tee dist/ci/unit-tests.log
      # The Gradle log is not always retrievable from the Actions API, so the
      # failure is also surfaced as check-run annotations.
      - name: Annotate test failures
        if: failure() && github.event_name != 'release'
        run: python3 scripts/ci/emit-failure-annotations.py dist/ci/unit-tests.log app/build/test-results
      # Unit-test reports: a red test run is otherwise invisible from the CLI
      # unless the job log is downloadable.
      - name: Upload unit test reports
        if: always() && github.event_name != 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
      # Android Lint runs on the online debug variant: it is the variant that
      # needs no runtime bundles, so it can be analysed on a clean runner.
      - name: Android Lint
        if: github.event_name != 'release'
        run: |
          set -o pipefail
          ./gradlew :app:lintOnlineDebug 2>&1 | tee dist/ci/lint.log
      - name: Annotate lint failures
        if: failure() && github.event_name != 'release'
        run: python3 scripts/ci/emit-failure-annotations.py dist/ci/lint.log
      - name: Upload lint report
        if: always() && github.event_name != 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

      # --- debug APK (branch pushes, manual runs, releases) ------------------
      # Only the online debug variant is produced here. It is the artifact a
      # branch run hands out; the published channel is built below.
      - name: Build debug APK
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
        run: ./gradlew assembleOnlineDebug
      # Tag each APK as mh-<versionName>-<shortsha>.apk so users can tell
      # which commit produced which binary without unpacking it.
      - name: Name APK with version and commit
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          SHORT_SHA="${GITHUB_SHA::7}"
          mkdir -p app/build/outputs/apk/online/debug-named
          for apk in app/build/outputs/apk/online/debug/*.apk; do
            base="$(basename "$apk" .apk)"
            named="mh-${VERSION}-${SHORT_SHA}-${base}.apk"
            cp "$apk" "app/build/outputs/apk/online/debug-named/$named"
            echo "Named artifact: $named"
          done
          ls -la app/build/outputs/apk/online/debug-named/
      - name: Upload APK artifact
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mh-dany-debug
          path: app/build/outputs/apk/online/debug-named/*.apk
          retention-days: 7

      # --- release APKs + update manifest (manual main run) ------------------
      # Every APK and the in-app update manifest are published together: the
      # app reads releases/latest/download/mobile-harness-update.json, which
      # used to be a 404 because nothing generated it.
      # A manual run on any ref builds the minified release variants: that is
      # the only way to catch an R8/proguard problem before it reaches main.
      # Publishing below is still restricted to main.
      - name: Build release APKs
        if: github.event_name == 'workflow_dispatch'
        env:
          MH_UPLOAD_STORE_FILE: ${{ secrets.MH_UPLOAD_STORE_FILE }}
          MH_UPLOAD_STORE_PASSWORD: ${{ secrets.MH_UPLOAD_STORE_PASSWORD }}
          MH_UPLOAD_KEY_ALIAS: ${{ secrets.MH_UPLOAD_KEY_ALIAS }}
          MH_UPLOAD_KEY_PASSWORD: ${{ secrets.MH_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew assembleOnlineRelease assembleOfflineRelease
      - name: Collect release APKs and write the update manifest
        if: github.event_name == 'workflow_dispatch'
        env:
          MH_RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          mkdir -p dist/ci
          # Everything this step decides (signature check, manifest contents) is
          # worth reading afterwards, and the job log is not always fetchable.
          exec > >(tee -a dist/ci/release.log) 2>&1
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          CHANNEL="${RELEASE_CHANNEL_TAG:-update-channel}"
          OUT=app/build/outputs/apk/release-named
          mkdir -p "$OUT"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${CHANNEL}"
          for variant in online offline; do
            src=$(ls app/build/outputs/apk/$variant/release/*.apk | head -1)
            cp "$src" "$OUT/mobile-harness-$variant-v${VERSION_NAME}.apk"
            echo "$variant -> mobile-harness-$variant-v${VERSION_NAME}.apk ($(stat -c%s "$OUT/mobile-harness-$variant-v${VERSION_NAME}.apk") bytes)"
          done
          # The manifest is generated from the APKs themselves (checksums), so a
          # manual edit cannot drift from the binaries it advertises.
          python3 scripts/generate_update_manifest.py \
            "$OUT" "$VERSION_CODE" "$VERSION_NAME" "$BASE" \
            --notes "$MH_RELEASE_NOTES" --channel "$CHANNEL"
          # An unsigned release still builds; it just cannot be installed.
          # Publishing it would offer every user an update that fails, so the
          # signature is verified before the manifest is written.
          python3 scripts/ci/verify-apk-signing.py "$OUT"/*.apk
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "--- manifest ---"
          cat "$OUT/mobile-harness-update.json"
      # Branch runs must not touch the published channel, but the minified
      # APKs are worth keeping: if R8 broke something, the APK is right here.
      - name: Upload release APK artifact
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mh-release-validation
          path: |
            app/build/outputs/apk/release-named/
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 7
      - name: Publish release APKs and the in-app update manifest
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT=app/build/outputs/apk/release-named
          # The channel release is recreated on every run and owns the
          # "latest" pointer, so the manifest URL the app reads stays a stable
          # .../releases/latest/download/mobile-harness-update.json path while
          # the APK URLs inside point at this run's tag.
          CHANNEL="${RELEASE_CHANNEL_TAG:-update-channel}"
          gh release delete "$CHANNEL" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$CHANNEL" \
            "$OUT"/*.apk \
            "$OUT/mobile-harness-update.json" \
            --title "Mobile Harness stable channel" \
            --notes "Rolling channel: current stable APKs and the in-app update manifest." \
            --latest
          echo "Published channel $CHANNEL"
          gh release view "$CHANNEL" --json assets --jq '.assets[].name'
      - name: Annotate release failures
        if: failure() && github.event_name == 'workflow_dispatch'
        run: python3 scripts/ci/emit-failure-annotations.py dist/ci/release.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: release-log
          path: dist/ci/release.log
          if-no-files-found: ignore
          retention-days: 7
      # --- tagged release (release event) ------------------------------------
      - name: Attach APKs to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            app/build/outputs/apk/online/debug-named/*.apk
