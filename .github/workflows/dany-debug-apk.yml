name: dany-debug-apk

on:
  push:
    branches:
      - main
      - 'dany/**'
      - 'fix/**'
      - 'feat/**'
      - 'ci/**'
      - 'refactor/**'
      - 'test/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable debug keystore
        env:
          MH_DEBUG_KEYSTORE_B64: ${{ secrets.MH_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          echo "$MH_DEBUG_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          echo "debug.keystore restored ($(stat -c%s "$HOME/.android/debug.keystore") bytes)"
          sha256sum "$HOME/.android/debug.keystore"
          ls -la "$HOME/.android/"
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mh-dany-debug
          path: app/build/outputs/apk/**/*.apk
