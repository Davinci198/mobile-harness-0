name: dany-debug-apk

on:
  push:
    branches:
      - main
      - 'dany/**'
      - 'fix/**'
      - 'feat/**'
      - 'ci/**'
      - 'refactor/**'
      - 'test/**'
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable debug keystore
        env:
          MH_DEBUG_KEYSTORE_B64: ${{ secrets.MH_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          echo "$MH_DEBUG_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          echo "debug.keystore restored ($(stat -c%s "$HOME/.android/debug.keystore") bytes)"
          sha256sum "$HOME/.android/debug.keystore"
          ls -la "$HOME/.android/"
      - name: Unit tests
        if: github.event_name != 'release'
        run: ./gradlew :app:testOnlineDebugUnitTest :app:testOfflineDebugUnitTest
      # APKs are built only on branch pushes, release tagging and manual runs —
      # merges to main and PR updates run tests only. Only the online debug
      # variant is produced.
      - name: Build debug APK
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
        run: ./gradlew assembleOnlineDebug
      # Tag each APK as mh-<versionName>-<shortsha>.apk so users can tell
      # which commit produced which binary without unpacking it.
      - name: Name APK with version and commit
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          SHORT_SHA="${GITHUB_SHA::7}"
          mkdir -p app/build/outputs/apk/online/debug-named
          for apk in app/build/outputs/apk/online/debug/*.apk; do
            base="$(basename "$apk" .apk)"
            named="mh-${VERSION}-${SHORT_SHA}-${base}.apk"
            cp "$apk" "app/build/outputs/apk/online/debug-named/$named"
            echo "Named artifact: $named"
          done
          ls -la app/build/outputs/apk/online/debug-named/
      - name: Upload APK artifact
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mh-dany-debug
          path: app/build/outputs/apk/online/debug-named/*.apk
          retention-days: 7
      # The debug-main rolling release is manual now: run this workflow from
      # main (workflow_dispatch) to replace it with a fresh online debug APK.
      - name: Drop previous rolling release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete debug-main --yes --cleanup-tag 2>/dev/null || echo "no previous rolling release"
      - name: Publish main release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: debug-main
          name: Mobile Harness (latest main)
          make_latest: true
          files: |
            app/build/outputs/apk/online/debug-named/*.apk
          fail_on_unmatched_files: true
      - name: Attach APKs to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            app/build/outputs/apk/online/debug-named/*.apk
