name: dany-debug-apk

on:
  push:
    branches:
      - main
      - 'dany/**'
      - 'fix/**'
      - 'feat/**'
      - 'ci/**'
      - 'refactor/**'
      - 'test/**'
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable debug keystore
        env:
          MH_DEBUG_KEYSTORE_B64: ${{ secrets.MH_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          echo "$MH_DEBUG_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          echo "debug.keystore restored ($(stat -c%s "$HOME/.android/debug.keystore") bytes)"
          sha256sum "$HOME/.android/debug.keystore"
          ls -la "$HOME/.android/"
      - name: Unit tests
        if: github.event_name != 'release'
        run: ./gradlew :app:testOnlineDebugUnitTest :app:testOfflineDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mh-dany-debug
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7
      # One rolling release instead of one per push: the previous debug-main release and
      # its tag are removed first, so the releases page stays at a single, always-current
      # entry. Older APKs are still available as run artifacts.
      - name: Drop previous rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete debug-main --yes --cleanup-tag 2>/dev/null || echo "no previous rolling release"
      - name: Publish main release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-main
          name: Mobile Harness (latest main)
          make_latest: true
          files: |
            app/build/outputs/apk/online/debug/*.apk
            app/build/outputs/apk/offline/debug/*.apk
          fail_on_unmatched_files: true
      - name: Attach APKs to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/online/debug/*.apk
            app/build/outputs/apk/offline/debug/*.apk
