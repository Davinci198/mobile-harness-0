name: dany-debug-apk

on:
  push:
    branches:
      - main
      - 'dany/**'
      - 'fix/**'
      - 'feat/**'
      - 'ci/**'
      - 'refactor/**'
      - 'test/**'
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable debug keystore
        env:
          MH_DEBUG_KEYSTORE_B64: ${{ secrets.MH_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          echo "$MH_DEBUG_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          echo "debug.keystore restored ($(stat -c%s "$HOME/.android/debug.keystore") bytes)"
          sha256sum "$HOME/.android/debug.keystore"
          ls -la "$HOME/.android/"
      - name: Unit tests
        if: github.event_name != 'release'
        run: ./gradlew :app:testOnlineDebugUnitTest :app:testOfflineDebugUnitTest
      # dist/runtime-bundles/*.tar.zst is gitignored, so without this step the
      # offline flavor assembles an APK with zero embedded bundles and every
      # on-demand stack install fails with a missing-asset error. Keep the base
      # URL in sync with runtimeReleaseBaseUrl in app/build.gradle.kts.
      - name: Fetch runtime bundles for the offline APK
        run: |
          set -euo pipefail
          base="https://github.com/techjarves/Mobile-Harness/releases/download/runtime-2026.09.4"
          jq -r '.bundles[] | "\(.file) \(.sha256)"' dist/runtime-bundles/manifest.json > "$RUNNER_TEMP/runtime-bundles.sha256"
          while read -r file sha; do
            echo "::group::${file}"
            curl -fL --retry 3 --retry-delay 2 -o "dist/runtime-bundles/${file}" "${base}/${file}"
            echo "${sha}  dist/runtime-bundles/${file}" | sha256sum --check -
            echo "::endgroup::"
          done < "$RUNNER_TEMP/runtime-bundles.sha256"
          ls -la dist/runtime-bundles
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mh-dany-debug
          path: app/build/outputs/apk/**/*.apk
      # One rolling release instead of one per push: the previous debug-main release and
      # its tag are removed first, so the releases page stays at a single, always-current
      # entry. Older APKs are still available as run artifacts.
      - name: Drop previous rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete debug-main --yes --cleanup-tag 2>/dev/null || echo "no previous rolling release"
      - name: Publish main release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-main
          name: Mobile Harness (latest main)
          make_latest: true
          files: |
            app/build/outputs/apk/online/debug/*.apk
            app/build/outputs/apk/offline/debug/*.apk
          fail_on_unmatched_files: true
      - name: Attach APKs to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/online/debug/*.apk
            app/build/outputs/apk/offline/debug/*.apk
